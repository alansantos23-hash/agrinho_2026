<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyAI — Organizador de Estudos</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #182033;
        }

        /* ===== SIDEBAR ===== */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: linear-gradient(180deg, #24104f, #44228b);
            color: white;
            padding: 25px 15px;
            z-index: 10;
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span {
            color: #bca2ff;
        }

        .menu button {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #ddd;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: .2s;
        }

        .menu button:hover,
        .menu button.active {
            background: rgba(255,255,255,.15);
            color: white;
        }

        /* ===== CONTEÚDO ===== */

        .content {
            margin-left: 240px;
            padding: 30px;
        }

        .page {
            display: none;
            animation: fade .3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top h1 {
            font-size: 30px;
        }

        .date {
            color: #777;
        }

        /* ===== CARDS ===== */

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
